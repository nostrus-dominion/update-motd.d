# Machine settings: /etc/update-motd.d/config/motd.conf
# Trusted Bash. Edit directly; changes are read on the next render.
MOTD_ROLE=""
# Modules run in this order. Remove a name to disable it; add one to enable it.
MOTD_MODULES=(
    10-hostname
    11-time-sync
    20-system-info
    21-cpu-load
    22-memory
    26-network
    32-disk-space
    80-update
    81-reboot-required
    91-other-users
)

# Display settings.
MOTD_COLOR=true
MOTD_BANNER=true
MOTD_FIGLET_FONT=standard
MOTD_FIGLET_WIDTH=80
MOTD_DATE_FORMAT='%A, %B %d, %Y %T %Z'
MOTD_LABEL_WIDTH=16
MOTD_BAR_WIDTH=40
MOTD_BAR_USED="="
MOTD_BAR_FREE="-"
MOTD_MAX_ITEMS=8

# Percentage, temperature, and update-count thresholds.
MOTD_USAGE_WARN=75
MOTD_USAGE_CRIT=90
MOTD_TEMP_WARN=70
MOTD_TEMP_CRIT=85
MOTD_LOAD_WARN=75       # 1-minute load as a percentage of available CPUs.
MOTD_LOAD_CRIT=100
MOTD_UPDATE_WARN=1
MOTD_UPDATE_CRIT=50

# Storage. Disk paths show their actual filesystem mountpoint.
# Required mounts are checked separately so an unmounted storage directory
# cannot accidentally appear healthy because it resides on the root disk.
MOTD_DISK_PATHS=("/")
MOTD_REQUIRED_MOUNTS=()
MOTD_SMART_DEVICES=()   # Empty = discover physical disks with lsblk.

# Service provider: none, systemd, openrc, or sysv.
MOTD_SERVICE_PROVIDER=none

# Service names and display labels.
declare -gA MOTD_SERVICES=(
    # [ssh.service]="SSH"
    # [nginx.service]="Nginx"
    # [docker.service]="Docker"
)

# Optional HTTP checks. A response from 200 through 399 is considered reachable.
# Use paths that actually exist on your application.
declare -gA MOTD_ENDPOINTS=(
    # [ComfyUI]="http://127.0.0.1:8188/"
    # [M.O.N.K.E.Y.]="http://127.0.0.1:9292/api/health"
)
MOTD_HTTP_TIMEOUT=2

# Optional process checks: label -> pgrep -f regular expression.
declare -gA MOTD_PROCESSES=(
    # [qBittorrent]='(^|/)qbittorrent-nox([[:space:]]|$)'
)

# Provider-specific names. Empty = all visible containers/instances.
MOTD_DOCKER_CONTAINERS=()
MOTD_PODMAN_CONTAINERS=()
MOTD_LXC_CONTAINERS=()
MOTD_LXD_INSTANCES=()

# Network and container display.
MOTD_NETWORK_INTERFACES=()    # Empty = all interfaces with global addresses.
MOTD_NETWORK_IPV6=false
MOTD_CONTAINER_LIMIT=20
MOTD_SHOW_STOPPED_CONTAINERS=true
MOTD_CONTAINER_EXCLUDE=()    # Shell glob patterns, e.g. "test-*" or "old_*".

# Certificates. Empty domain list = all Certbot certificate directories.
MOTD_CERT_DIR=/etc/letsencrypt/live
MOTD_CERT_DOMAINS=()
MOTD_CERT_WARN_DAYS=14
MOTD_CERT_CRIT_DAYS=3

# Optional information.
MOTD_FAIL2BAN_LOG=/var/log/fail2ban.log
MOTD_LAST_LOGIN_COUNT=3
MOTD_NOTES=""                # Multiline text for 98-notes.

# Bound command execution and cache expensive modules, in seconds.
MOTD_COMMAND_TIMEOUT=3
MOTD_MODULE_TIMEOUT=10
MOTD_CACHE_ENABLED=true
declare -gA MOTD_CACHE_TTL=(
    [23-temperatures]=10
    [24-gpu]=10
    [30-disk-health]=300
    [34-zpool-status]=30
    [35-zpool]=30
    [50-ssl-cert]=300
    [60-pia-vpn]=15
    [70-fail2ban]=600
    [80-update]=300
)
declare -gA MOTD_TIMEOUTS=(
    [30-disk-health]=30
    [70-fail2ban]=10
)

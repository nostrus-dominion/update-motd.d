# Shared ANSI colors. Escaped sequences and $'\033[...]' both work.
# You may copy values from your existing colors.conf into these mappings.

MOTD_ACCENT='\033[0;36m'
MOTD_OK='\033[0;32m'
MOTD_WARNING='\033[1;33m'
MOTD_ERROR='\033[0;31m'
MOTD_DIM='\033[2m'
MOTD_RESET='\033[0m'

# ANSI-256 example:
# MOTD_ACCENT='\033[38;5;208m'
